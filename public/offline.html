<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0E14" />
    <title>Sin conexión · Aura Espacio</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0a0e14;
        --text: #f2f0f7;
        --muted: #a8a3b8;
        --accent: #b8aee8;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background:
          radial-gradient(90% 70% at 20% 0%, rgba(184, 174, 232, 0.22), transparent 60%),
          radial-gradient(70% 60% at 100% 30%, rgba(143, 203, 176, 0.14), transparent 60%),
          var(--bg);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      .card {
        width: 100%;
        max-width: 380px;
        padding: 32px 28px;
        border-radius: 28px;
        background: rgba(22, 27, 34, 0.62);
        border: 1px solid rgba(255, 255, 255, 0.13);
        box-shadow: 0 24px 64px rgba(2, 5, 10, 0.55);
        backdrop-filter: blur(28px);
        text-align: center;
      }
      .mark {
        width: 52px;
        height: 52px;
        margin: 0 auto 18px;
        border-radius: 16px;
        background: linear-gradient(135deg, #b8aee8, #8fcbb0);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 3px;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3);
      }
      .mark span {
        display: block;
        height: 3px;
        border-radius: 2px;
        background: rgba(10, 14, 20, 0.78);
      }
      .mark span:nth-child(1) { width: 18px; }
      .mark span:nth-child(2) { width: 13px; }
      .mark span:nth-child(3) { width: 16px; }
      h1 {
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 22px;
        letter-spacing: -0.02em;
        margin: 0 0 8px;
      }
      p {
        color: var(--muted);
        font-size: 13.5px;
        line-height: 1.6;
        margin: 0;
      }
      .hint {
        margin-top: 16px;
        font-size: 11.5px;
        color: #6c677c;
      }
      button {
        margin-top: 22px;
        height: 42px;
        padding: 0 20px;
        border: 0;
        border-radius: 14px;
        background: var(--accent);
        color: #0a0e14;
        font-weight: 700;
        font-size: 13.5px;
        cursor: pointer;
        font-family: inherit;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark" aria-hidden="true">
        <span></span><span></span><span></span>
      </div>
      <h1>Sin conexión</h1>
      <p>
        Aura Espacio necesita internet para guardar y traer tus datos.
        Revisá tu conexión y volvé a intentar.
      </p>
      <button onclick="location.reload()">Reintentar</button>
      <p class="hint">Las páginas que ya visitaste pueden seguir disponibles.</p>
    </main>
  </body>
</html>
